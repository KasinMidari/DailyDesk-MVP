<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-dailydesk.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyDesk</title>
  </head>
  <body>
    <!-- Gắn class giao diện trước khi React chạy, nếu không người dùng chế độ tối
         sẽ thấy nền giấy loé lên mỗi lần tải trang. -->
    <script>
      try {
        var t = localStorage.getItem("dailydesk-theme") || "system";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(d ? "dark" : "light");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
